<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VillaRide - Iniciar Sesión / Registro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-secondary);
            overflow: auto;
        }
        .auth-container {
            background: var(--bg-primary);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .auth-header {
            margin-bottom: 24px;
        }
        .auth-header i {
            font-size: 36px;
            margin-bottom: 12px;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            font-size: 15px;
        }
        .auth-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent-color);
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: left;
        }
        .auth-form label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }
        .auth-form input:focus {
            border-color: var(--accent-color);
        }
        .error-msg {
            color: var(--danger-color);
            font-size: 13px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body class="light-mode">

    <div class="auth-container">
        <div class="auth-header">
            <i class="fa-solid fa-car-side"></i>
            <h2>Bienvenido a VillaRide</h2>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchAuthMode('login')">Iniciar Sesión</button>
            <button class="auth-tab" id="tab-register" onclick="switchAuthMode('register')">Registrarse</button>
        </div>

        <form id="auth-form" class="auth-form">
            <div id="name-group" class="hidden">
                <label for="user-name">Nombre Completo</label>
                <input type="text" id="user-name" placeholder="Tu nombre">
            </div>

            <div>
                <label for="user-email">Correo Electrónico</label>
                <input type="email" id="user-email" placeholder="ejemplo@correo.com" required>
            </div>

            <div>
                <label for="user-password">Contraseña</label>
                <input type="password" id="user-password" placeholder="••••••••" required>
            </div>

            <p id="error-message" class="error-msg"></p>

            <button type="submit" id="submit-btn" class="primary-btn">Iniciar Sesión</button>
        </form>
    </div>

    <script>
        // Si ya hay sesión iniciada, redirigir directamente al Index
        if (localStorage.getItem('currentUser')) {
            window.location.href = 'index.html';
        }

        let mode = 'login';

        function switchAuthMode(newMode) {
            mode = newMode;
            document.getElementById('tab-login').classList.toggle('active', mode === 'login');
            document.getElementById('tab-register').classList.toggle('active', mode === 'register');
            document.getElementById('name-group').classList.toggle('hidden', mode === 'login');
            document.getElementById('submit-btn').textContent = mode === 'login' ? 'Iniciar Sesión' : 'Crear Cuenta';
            document.getElementById('error-message').style.display = 'none';
        }

        document.getElementById('auth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value.trim();
            const password = document.getElementById('user-password').value;
            const name = document.getElementById('user-name').value.trim();
            const errorEl = document.getElementById('error-message');

            let users = JSON.parse(localStorage.getItem('users') || '[]');

            if (mode === 'register') {
                if (!name) {
                    errorEl.textContent = 'Por favor ingresa tu nombre.';
                    errorEl.style.display = 'block';
                    return;
                }
                const existing = users.find(u => u.email === email);
                if (existing) {
                    errorEl.textContent = 'Este correo ya está registrado.';
                    errorEl.style.display = 'block';
                    return;
                }
                const newUser = { name, email, password, rating: '5.00' };
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                window.location.href = 'index.html';
            } else {
                const user = users.find(u => u.email === email && u.password === password);
                if (!user) {
                    errorEl.textContent = 'Correo o contraseña incorrectos.';
                    errorEl.style.display = 'block';
                    return;
                }
                localStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
